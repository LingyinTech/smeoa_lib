<script type="text/javascript">
    function addAlbum(type) {
        var url = "{:U('doc/add')}" + '?type=' + type;
        winopen(url, 700, 350);
    }

    function addFile(type) {
        var url = "{:U('doc/add_file')}" + '?type=' + type;
        winopen(url, 780, 550);
    }

    $(document).ready(function () {
        set_return_url();

        $('.batchMgr').on('click', function () {
            $(this).hide();
            $('.all').show();
            $('.batchDelete').show();
            $('.return').show();
            $('.mod-photo-op').show();
        });

        $('.all').on('click', function () {
            var checked = parseInt($(this).attr('data-checked'));
            checked = !checked;
            console.log(checked);
            $('.mod-photo-op').each(function () {
                $(this).prop('checked', checked);
            });
            checked = checked ? 1 : 0;
            $(this).attr('data-checked', checked);
        });

        $('.return').on('click', function () {
            $('.batchMgr').show();
            $('.all').hide();
            $('.batchDelete').hide();
            $('.return').hide();
            $('.mod-photo-op').hide();
        });

        $('.batchDelete').on('click', function () {
            var deleteArr = [];
            $('.mod-photo-op').each(function () {
                if ($(this).prop('checked')) {
                    deleteArr.push($(this).val());
                }
            });

            if (deleteArr == false) {
                layer.msg('请选择要删除的相册');
                return false;
            }
            var idList = deleteArr.join(',');
            if (confirm('删除后无法还原,确认删除？')) {
                sendAjax("{:U('delete_album')}", 'idList=' + idList, function (data) {
                    if (data.status) {
                        ui_alert(data.info, function () {
                            location.reload();
                        });
                    } else {
                        ui_error(data.info);
                    }
                });
            }
        })

    });
</script>
