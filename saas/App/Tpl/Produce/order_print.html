<layout name='Layout/ace_popup'/>
<style>
    #div_print img {
        max-width: 800px;
    }
</style>

<div class="panel-heading clearfix">
    <div class="pull-right">
        <a onclick="pdfPrint()" class="btn btn-sm btn-primary">打印</a>
        <if condition="$type eq 'index'">
        <a onclick="selectPrint({$order.id})" class="btn btn-sm btn-primary">调整印刷工艺</a>
        </if>
    </div>
</div>
<div class="col-xs-12" id="div_print">

    <!--startprint-->

    <style>
        .order.type4 {
            font-weight: bold;
            color: red !important;
        }

        .note {
            font-size: 16px;
        }

        @media print{
            @page {
                font-size: 16px;
            }
            .header {
                font-size: 16px;
            }
        }
    </style>

    <p>
        <span class="craft_type" data-craft="{$order.craft_type}">印刷工艺：</span>
        <span>{$order.craft_type}</span>
        <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span>订单类型及备注：</span>
        <span class="order type{$order['order_type']}" <if condition="$order['order_type'] eq 4">style=""</if>>
            {$orderTypeList[$order['order_type']]} 
            
            {$order.content} 
            
        </span>
    </p>

    <p>
        <span>客户信息：</span>
        <span>{$order.cust_name}</span>
    </p>

    <p class="note">
        {$order.product_note}
    </p>

    <p class="note">
        {$order.note}
    </p>

    <foreach name="prev_list" item="file">
        <p style="text-align: center;">
            <img src="{$imageCache}{$file.save_name}" style="width:260mm;max-height: 165mm;"/>
        </p>
    </foreach>
    <!--endprint-->
</div>
