<layout name='Layout/ace_popup' />
{:W('PageHeader',array('name'=>'设计图稿','search'=>'N'))}
<div class="operate panel">
	<div class="row">
		<div class="pull-right">
			<a  onclick="save({$orderId});" class="btn btn-sm btn-primary">保存</a>
			<a  onclick="myclose();" class="btn btn-sm btn-default">关闭</a>
		</div>
		<div id="uploadprev" class="pull-left">
			<a id="prevfiles" href="javascript:;" class="btn btn-sm btn-primary">添加效果图</a>
		</div>
	</div>

<div class="uploadprev">
	<ul id="prev_list" new_upload="{$prevSid}" >
		<notempty name="prev_list">
			<volist name="prev_list" id="file">
				<li class="tbody" id="{$file.sid}" add_file="{$file.sid}" size="{$file.size}" filename="{$file.name}">
					<div class="loading"></div>
					<div class="data">
						<span class="del text-center"><a class="link del">删除</a> </span>
						<span class="size" >{$file.size|reunit}</span>
						<span class="auto autocut" title="{$file.name}">
							<a href="javascript:checkShow('{$file.sid}','{$file.extension}');">{$file.name}</a>
						</span>
					</div>
					<img class="{$file.sid}" data-src="{$imageCache}{$file.save_name}" style="max-width: 700px;margin-top: 5px;display: none;"/>
				</li>
			</volist>
		</notempty>
	</ul>
</div>
<div class="row">
	<div id="uploader" class="pull-left">
		<a id="pickfiles" href="javascript:;" class="btn btn-sm btn-primary">添加高清图和文档</a>
	</div>
</div>
<div class="uploader">
	<ul id="file_list" new_upload="{$fileSid}" >
		<notempty name="file_list">
			<volist name="file_list" id="file">
				<li class="tbody" id="{$file.sid}" add_file="{$file.sid}" size="{$file.size}" filename="{$file.name}">
					<div class="loading"></div>
					<div class="data">
						<span class="del text-center"><a class="link del">删除</a> </span>
						<span class="size" >{$file.size|reunit}</span>
						<span class="auto autocut" title="{$file.name}">
							<a href="javascript:checkShow('{$file.sid}','{$file.extension}');">{$file.name}</a>
						</span>
					</div>
					<img class="{$file.sid}" data-src="{$imageCache}{$file.save_name}" style="max-width: 700px;margin-top: 5px;display: none;"/>
				</li>
			</volist>
		</notempty>
	</ul>
</div>
</div>
