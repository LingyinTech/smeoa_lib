<layout name='Layout/ace_popup' />
{:W('PageHeader',array('name'=>'设计图稿','search'=>'N'))}
<div class="operate panel">
	<div class="row">
		<div class="pull-right">
			<a href="{:U('design/batchDown')}?order_id={$orderId}" target="_blank" class="btn btn-sm btn-primary">批量下载</a>

			<a  onclick="myclose();" class="btn btn-sm btn-default">关闭</a>
		</div>
	</div>


	<if condition="!empty($preview)">
		<div class="row">
			<div class="pull-left">
				<a class="btn btn-sm btn-primary">效果图</a>
			</div>
		</div>

		<div class="uploadprev">
			<ul id="prev_list" new_upload="{$preview.url}" >
				<notempty name="preview.list">
					<volist name="preview.list" id="file">
						<li class="tbody" id="{$file.sid}">
							<div class="data">
								<span class="size" >{$file.size|reunit} <a href="{:U('down?attach_id='.f_encode($file['id']))}">下载</a> </span>
								<span class="auto autocut" title="{$file.name}">
									<a href="javascript:checkShow('{$file.sid}','{$file.extension}');">{$file.name}</a>
								</span>
							</div>
							<img class="{$file.sid}" data-src="{$imageCache}{$file.save_name}?x-oss-process=style/600" style="max-width: 600px;margin-top: 5px;display: none;"/>
						</li>
					</volist>
				</notempty>
			</ul>
		</div>
	</if>

	<if condition="!empty($design)">
		<div class="row">
			<div class="pull-left">
				<a class="btn btn-sm btn-primary">高清图和文档</a>
			</div>
		</div>

		<div class="uploader">
			<ul id="file_list" new_upload="{$design.url}" >
				<notempty name="design.list">
					<volist name="design.list" id="file">
						<li class="tbody" id="{$file.sid}">
							<div class="data">
								<span class="size" >{$file.size|reunit} <a href="{:U('down?attach_id='.f_encode($file['id']))}">下载</a> </span>
								<span class="auto autocut" title="{$file.name}">
									<a href="javascript:checkShow('{$file.sid}','{$file.extension}');">{$file.name}</a>
								</span>
							</div>
							<img class="{$file.sid}" data-src="{$imageCache}{$file.save_name}?x-oss-process=style/600" style="max-width: 600px;max-height:500px;margin-top: 5px;display: none;"/>
						</li>
					</volist>
				</notempty>
			</ul>
		</div>
	</if>

</div>
