#
# The lingyin99.com server
#
server {
    listen       80;
    server_name  saas.order.lingyin99.com;

    root /data/www/saas;
    index index.php;

    #charset koi8-r;
    access_log  /var/log/nginx/saas.order.lingyin99.com.access.log  main;

    location ^~ /Public/ {
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        deny all;
    }

    error_page  404              /404.html;
    location = /404.html {
        root   html;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    location ~ /\.ht {
        deny  all;
    }
}

