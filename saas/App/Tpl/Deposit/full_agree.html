<layout name='Layout/ace_popup' />

<div class="operate panel panel-default">
	<div class="panel-body">
		<div class="pull-left">
			<a  onclick="save();" class="btn btn-sm btn-primary">确定</a>
		</div>
		<div class="pull-right">
			<a  onclick="myclose();" class="btn btn-sm btn-primary">关闭</a>
		</div>
	</div>
	<form method='post' id="form_data" name="form_data" enctype="multipart/form-data"  class="well form-horizontal">
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">收款方式*：</label>
			<div class="col-sm-8">			
				<select name="full_pay_type" id="full_pay_type" check="require" msg="收款方式不能为空">
					<option value="">请选择</option>
					{:fill_option_array($full_pay_type,$full['full_pay_type'])}
				</select>
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">收款金额*：</label>
			<div class="col-sm-8">			
				<input name="full_pay_money" id="full_pay_money" value="{$full['full_pay_money']}" check="require" msg="收款金额不能为空" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">收款时间*：</label>
			<div class="col-sm-8">			
				<input data-date-format="yyyy-mm-dd" type="text" id="full_pay_time" name="full_pay_time" value="{$full.full_pay_time|date='Y-m-d',###}" readonly="readonly" class="input-date form-control" checked="require" msg="收款时间不能为空" >
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">经理提成*：</label>
			<div class="col-sm-8">			
				<input name="manager_money" id="manager_money" value="{$full['manager_money']}" check="require" msg="经理提成不能为空" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">总监提成*：</label>
			<div class="col-sm-8">			
				<input name="director_money" id="director_money" value="{$full['director_money']}" check="require" msg="总监提成不能为空" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">区域提成*：</label>
			<div class="col-sm-8">			
				<input name="area_money" id="area_money" value="{$full['area_money']}" check="require" msg="区域提成不能为空" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">说明*：</label>
			<div class="col-sm-8">			
				<input name="note" id="note" value="{$full.note}" class="form-control" />
			</div>
		</div>
		<input name="orderid" id="orderid" value="{$orderid}" type="hidden" />
		<input type="hidden" id="ajax" name="ajax" value="1">
	</form>
</div>
