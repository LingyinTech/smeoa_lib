<layout name='Layout/ace_popup'/>

<div class="container company-oms">

    <div class="panel-heading clearfix">
        <div class="pull-right">
            <a href="{:U('read',array('id'=>$order['id']))}" class="btn btn-sm btn-primary">编辑</a>
        </div>
    </div>

    <div class="well">

        <div class="row first-row">
            <div class="col-md-1"><img style="height: 47px;" src="{:get_logo_url()}"></div>
            <div class="col-md-1">接单人:</div>
            <div class="col-md-1 form-data"><input type="text" id="sales" name="sales" value="{$userName}" readonly></div>
            <div class="col-md-1">生产编号：</div>
            <div class="col-md-2">{$order.produce_no}</div>
            <div class="col-md-1 form-data">
                <select name="customer_type">
                    <option value="">客户类型</option>
                    {:fill_option($customerTypeList)}
                </select>
            </div>
            <div class="col-md-1">订单类型</div>
            <div class="col-md-1 form-data">
                <select name="order_type">
                    {:fill_option($orderTypeList)}
                </select>
            </div>
            <div class="col-md-2 form-data">
                <input class="content" name="content" type="text" placeholder="备注（加定前订单编号及其他）">
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row">
            <div class="col-md-1">店铺名称</div>
            <div class="col-md-1 form-data">
                <select name="shop_id" id="shop_id" check="require" msg="请选择店铺">
                    <option value="">请选择店铺</option>
                    {:fill_option($shopList)}
                </select>
            </div>
            <div class="col-md-1">客户信息</div>
            <div class="col-md-2 form-data">
                <input type="text" name="cust_name" required msg="请填写客户信息" placeholder="（淘宝ID）">
            </div>
            <div class="col-md-2 form-data">
                <input type="text" name="order_sn" placeholder="（订单编号）">
            </div>
            <div class="col-md-2 form-data">
                <input type="text" name="impression" placeholder="（订单印象）">
            </div>
            <div class="col-md-1">下单时间</div>
            <div class="col-md-1 form-data">
                <input data-date-format="yyyy-mm-dd" type="text" id="order_time" name="order_time"
                       readonly="readonly" class="input-date form-control" check="require" msg="下单时间不能为空">
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <if condition="!empty($checkPricePermission)">
        <div class="row">
            <div class="col-md-1">订单金额</div>
            <div class="col-md-1 form-data">
                <input type="text" name="total_price" class="total_price">
            </div>
            <div class="col-md-1">尾款</div>
            <div class="col-md-1 form-data">
                <input type="text" name="rest_price" class="rest_price">
            </div>
            <div class="col-md-1">返差</div>
            <div class="col-md-1 form-data">
                <input type="text" name="diff_price" class="diff_price">
            </div>
            <div class="col-md-2 form-data">
                <input type="text" name="diff_note" placeholder="（特别备注）">
            </div>
            <div class="col-md-1">付款方式</div>
            <div class="col-md-1 form-data">
                <select name="pay_type">
                    {:fill_option($payTypeList)}
                </select>
            </div>
            <div class="col-md-1 form-data payment_voucher">
                <span class="fa fa-search display-none"></span>
                <input type="hidden" name="payment_voucher" value="">

                <div class="display-none" id="payment_voucher_container"></div>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>
        </if>

        <div class="row">
            <div class="col-md-1">底衫选择</div>
            <div class="col-md-1 form-data">
                <select name="shirt_type">
                    <option value="">请选择</option>
                    {:fill_option($shirtTypeList)}
                </select>
            </div>

            <div class="col-md-1">调货商及单号</div>
            <div class="col-md-2 form-data">
                <input type="text" name="shirt_note">
            </div>

            <div class="col-md-1">工艺选择</div>
            <div class="col-md-1">
                <select name="craft_type">
                    <option value="0">请选择</option>
                    {:fill_option($craftTypeList)}
                </select>
            </div>
            <div class="col-md-1">底衫价格</div>
            <div class="col-md-1 form-data">
                <if condition="!empty($checkPlanOrder)">
                    <input type="text" name="shirt_price" class="shirt_price">
                <else />
                    <a class="glyphicon glyphicon-question-sign" title="无权限操作"></a>
                </if>
            </div>
            <div class="col-md-1">产品毛利</div>
            <div class="col-md-1 form-data">
                <if condition="!empty($checkPlanOrder)">
                    <input type="text" name="gross_profit" readonly> %
                <else />
                    <a class="glyphicon glyphicon-question-sign" title="无权限操作"></a>
                </if>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <if condition="!empty($useProduct)">
        <foreach name="order.productList" item="vo">
        <div class="row style" data-product-index="{$vo.id}">
            <div class="col-md-1">
                款式
            </div>
            <div class="col-md-1 form-data">
                <select name="style[{$vo.id}]" check="require" msg="请选择款式">
                    <option value="">请选择</option>
                    {:fill_option($styleList,$vo['style'])}
                </select>
            </div>

            <div class="col-md-2">
                <div class="row three-row">
                    <div class="col-md-4 hard">颜色</div>
                    <div class="col-md-4 form-data-size hard">
                        <input type="text" name="color[{$vo.id}]" value="{$vo.color}" check="require" msg="请填写颜色">
                    </div>
                    <div class="col-md-4">尺码</div>
                </div>
            </div>
            <div class="col-md-1">
                <div class="row">
                    <div class="col-md-6 line1 hard"></div>
                    <div class="col-md-6 line1">XS</div>
                </div>
                <div class="row">
                    <div class="col-md-6 line2 hard">男</div>
                    <div class="col-md-6 form-data-size line2">
                        <input type="number" name="mxs[{$vo.id}]" value="{$vo.mxs}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 hard">女</div>
                    <div class="col-md-6 form-data-size">
                        <input type="number" name="fxs[{$vo.id}]" value="{$vo.fxs}">
                    </div>
                </div>
            </div>

            <div class="col-md-1">
                <div class="row">
                    <div class="col-md-6 line1 hard">S</div>
                    <div class="col-md-6 line1">M</div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size line2 hard">
                        <input type="number" name="ms[{$vo.id}]" value="{$vo.ms}">
                    </div>
                    <div class="col-md-6 form-data-size line2">
                        <input type="number" name="mm[{$vo.id}]" value="{$vo.mm}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size hard">
                        <input type="number" name="fs[{$vo.id}]" value="{$vo.fs}">
                    </div>
                    <div class="col-md-6 form-data-size">
                        <input type="number" name="fm[{$vo.id}]" value="{$vo.fm}">
                    </div>
                </div>
            </div>

            <div class="col-md-1">
                <div class="row">
                    <div class="col-md-6 line1 hard">L</div>
                    <div class="col-md-6 line1">XL</div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size line2 hard">
                        <input type="number" name="ml[{$vo.id}]" value="{$vo.ml}">
                    </div>
                    <div class="col-md-6 form-data-size line2">
                        <input type="number" name="mxl[{$vo.id}]" value="{$vo.mxl}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size hard">
                        <input type="number" name="fl[{$vo.id}]" value="{$vo.fl}">
                    </div>
                    <div class="col-md-6 form-data-size">
                        <input type="number" name="fxl[{$vo.id}]" value="{$vo.fxl}">
                    </div>
                </div>
            </div>

            <div class="col-md-1">
                <div class="row">
                    <div class="col-md-6 line1 hard">2XL</div>
                    <div class="col-md-6 line1">3XL</div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size line2 hard">
                        <input type="number" name="mxxl[{$vo.id}]" value="{$vo.mxxl}">
                    </div>
                    <div class="col-md-6 form-data-size line2">
                        <input type="number" name="mxxxl[{$vo.id}]" value="{$vo.mxxxl}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size hard">
                        <input type="number" name="fxxl[{$vo.id}]" value="{$vo.fxxl}">
                    </div>
                    <div class="col-md-6 form-data-size">
                        <input type="number" name="fxxxl[{$vo.id}]" value="{$vo.fxxxl}">
                    </div>
                </div>
            </div>

            <div class="col-md-1">
                <div class="row">
                    <div class="col-md-6 line1 hard">4XL</div>
                    <div class="col-md-6 line1">小计</div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size line2 hard">
                        <input type="number" name="mxxxxl[{$vo.id}]" value="{$vo.mxxxxl}">
                    </div>
                    <div class="col-md-6 form-data-size line2">
                        <input type="text" readonly="readonly" name="mtotal[{$vo.id}]" value="{$vo.mtotal}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 form-data-size hard">
                        <input type="number" name="fxxxxl[{$vo.id}]" value="{$vo.fxxxxl}">
                    </div>
                    <div class="col-md-6 form-data-size">
                        <input type="text" readonly="readonly" name="ftotal[{$vo.id}]" value="{$vo.ftotal}">
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="row">
                    <div class="col-md-3 line1 hard">总计</div>
                    <div class="col-md-9 line1">备注</div>
                </div>
                <div class="row two-row">
                    <div class="col-md-3 form-data-size hard">
                        <input type="text" readonly="readonly" name="total_count[{$vo.id}]" value="{$vo.total_count}">
                    </div>
                    <div class="col-md-9 form-data-size">
                        <textarea name="style_note[{$vo.id}]">{$vo.style_note}</textarea>
                    </div>
                </div>
            </div>

            <div class="col-md-1 last-col">
                <span class="fa fa-plus"></span>
                <span class="fa fa-minus"></span>
            </div>
        </div>
        </foreach>
        </if>

        <div class="row note">
            <div class="col-md-1 title">产品备注及调货信息</div>
            <div class="col-md-10 form-data">
                <textarea name="product_note" required msg="请填写产品信息备注"></textarea>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row note">
            <div class="col-md-1 title">发货信息</div>
            <div class="col-md-10 form-data">
                <textarea name="note" required msg="请填写产品及发货信息备注"></textarea>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row">
            <div class="col-md-11 text-center">预览图</div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row preview">
            <div class="col-md-11 text-center">
                <foreach name="prev_list" item="file">
                    <img src="{$imageCache}{$file.save_name}?x-oss-process=style/800"/>
                </foreach>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row">
            <div class="col-md-11 text-center">流程详情</div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row flow-content">
            <div class="col-md-11 text-left">
                <empty name="flowList">
                    暂无动静
                <else/>
                    <foreach name="flowList" item="vo">
                        <p>{$vo.create_time|date="Y-m-d H:i:s",###} {$vo.user_name} {$vo.note}</p>
                    </foreach>
                </empty>

            </div>
            <div class="col-md-1 last-col"></div>
        </div>

    </div>

    <div class="panel-heading clearfix">
        <div class="pull-right" style="margin-top: 10px;">
            <a href="{:U('read',array('id'=>$order['id']))}" class="btn btn-sm btn-primary">编辑</a>
        </div>
    </div>

</div>
