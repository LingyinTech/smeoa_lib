<layout name='Layout/ace_popup' />
<form method="post" name="form_adv_search" id="form_adv_search">
	<div class="adv_search panel panel-default"  id="adv_search">
		<div class="panel-heading">
			<div class="row">
				<h4 class="col-xs-6">导出条件（留空导出所有订单）</h4>
				<div class="col-xs-6 text-right">
					<a  class="btn btn-sm btn-info" onclick="submit_adv_search();">导出</a>
					<a  class="btn btn-sm " onclick="myclose();">关闭</a>
				</div>
			</div>
		</div>
		<div class="panel-body">
			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="li_sales">接单人：</label>
				<div class="col-sm-8">
					<input  class="form-control" type="text" id="li_sales" name="li_sales" >
				</div>
			</div>

			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="li_cust_name">客户姓名：</label>
				<div class="col-sm-8">
					<input  class="form-control" type="text" id="li_cust_name" name="li_cust_name" >
				</div>
			</div>
			
			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="lt_produce_no">订单编号：</label>
				<div class="col-sm-8">
					<div class="input-daterange input-group" >
					    <input type="text" class="input-sm form-control text-center" name="gt_produce_no" />
						<span class="input-group-addon">-</span>
						<input type="text" class="input-sm form-control text-center" name="lt_produce_no" />
					</div>
				</div>
			</div>
			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="lt_produce_no">订单流程：</label>
				<div class="col-sm-8">
					<select name="typeid" id="typeid" class="form-control col-10">
					<option value="">请选择</option>
					{:fill_option($flowlist)}
					<option value="已退单">已退单</option>
					</select>
				</div>
			</div>
			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="li_cust_name">单位（班级）：</label>
				<div class="col-sm-8">
					<input  class="form-control" type="text" id="li_unit" name="li_unit" >
				</div>
			</div>
		</div>
	</div>
</form>
