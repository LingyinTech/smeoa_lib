<layout name='Layout/ace_popup' />
<div style="height: 60px;"></div>
<form method="post" name="form_adv_search" id="form_adv_search">
	<div class="adv_search panel panel-default"  id="adv_search">
		<div class="panel-heading">
			<div class="row">
				<h4 class="col-xs-6">导出条件（留空导出所有人员）</h4>
				<div class="col-xs-6 text-right">
					<a  class="btn btn-sm btn-info" onclick="submit_adv_search();">导出</a>
					<a  class="btn btn-sm " onclick="myclose();">关闭</a>
				</div>
			</div>
		</div>
		<div class="panel-body">
			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="li_dept_id">部门：</label>
				<div class="col-sm-8">
					<select name="li_dept_id" id="li_dept_id" class="form-control col-10">
					<option value="">请选择</option>
					{:fill_option($deptlist)}
					</select>
				</div>
			</div>			
			<div class="form-group col-sm-6">
				<label class="col-sm-4 control-label" for="gt_create_time">添加时间：</label>
				<div class="col-sm-8">
					<div class="input-daterange input-group">
					    <input data-date-format="yyyy-mm-dd" type="text" id="gt_create_time" name="gt_create_time" readonly="readonly" class="input-date" style="width: 200px" >
						<span class="input-group-addon">-</span>
						<input data-date-format="yyyy-mm-dd" type="text" id="lt_create_time" name="lt_create_time" readonly="readonly" class="input-date" style="width: 200px" >
					</div>
				</div>
			</div>
		</div>
	</div>
</form>
