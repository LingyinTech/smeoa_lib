<layout name='Layout/ace_popup'/>
<div class="panel-heading clearfix">
    <div class="pull-right">
        <a href="{:U('read',array('id'=>$order['id']))}" class="btn btn-sm btn-primary">编辑</a>
    </div>
</div>

<div class="container company-oms">

    <div class="well">

        <div class="row first-row">

            <div class="col-md-1"><img style="height: 47px;" src="{:get_logo_url()}"></div>
            <div class="col-md-1">接单人:</div>
            <div class="col-md-1 form-data">
                <input type="hidden" name="sales" value="{$userName}">
                <select name="user_id">
                    {:fill_option($userList,$userId)}
                </select>
            </div>

            <div class="col-md-1">
                发票类型
            </div>
            <div class="col-md-2">
                <select name="invoice" id="invoice">
                    {:fill_option($invoiceList)}
                </select>
            </div>

            <div class="col-md-1">对公公司：</div>
            <div class="col-md-2">
                <select name="corporate_account">
                    {:fill_option($corporateAccountList)}
                </select>
            </div>

            <div class="col-md-2">
                <input type="text" name="invoice_price" placeholder="发票金额">
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row">
            <div class="col-md-1">店铺名称</div>
            <div class="col-md-1 form-data">
                <select name="shop_id" id="shop_id" check="require" msg="请选择店铺">
                    <option value="">请选择店铺</option>
                    {:fill_option($shopList)}
                </select>
            </div>
            <div class="col-md-1">客户信息</div>
            <div class="col-md-2 form-data">
                <input type="text" name="cust_name" required msg="请填写客户信息" placeholder="（淘宝ID）">
            </div>
            <div class="col-md-3 form-data">
                <input type="text" name="order_sn" placeholder="（订单编号）">
            </div>
            <div class="col-md-1">订单付款时间</div>
            <div class="col-md-2">
                <input data-date-format="yyyy-mm-dd" type="text" id="pay_time" name="pay_time" readonly="readonly"
                       class="input-date form-control" check="require" msg="订单付款时间不能为空">
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row">
            <div class="col-md-1">发票抬头</div>
            <div class="col-md-10">
                <input type="text" name="invoice_name" placeholder="请填写发票抬头">
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row note invoice_note">
            <div class="col-md-1">发票信息</div>
            <div class="col-md-10 form-data">
            <textarea name="invoice_desc" required msg="请填写发票信息：公司抬头，公司税号，开票总价、件数、单价、内容等"
              placeholder="请填写发票信息：公司抬头，公司税号，开票总价、件数、单价、内容等"></textarea>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row note">
            <div class="col-md-1">收件人信息</div>
            <div class="col-md-10 form-data">
                <textarea name="ship_address" required msg="请务必填写收件人名字电话及详细地址"></textarea>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

        <if condition="!empty($order['print_desc'])">
        <div class="row note">
            <div class="col-md-1">备注</div>
            <div class="col-md-10 form-data">
                <textarea name="print_desc"></textarea>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>
        </if>

        <div class="row">
            <div class="col-md-11 text-center">流程详情</div>
            <div class="col-md-1 last-col"></div>
        </div>

        <div class="row flow-content">
            <div class="col-md-11 text-left">
                <empty name="flowList">
                    暂无动静
                <else/>
                    <foreach name="flowList" item="vo">
                        <p>{$vo.create_time|date="Y-m-d H:i:s",###} {$vo.user_name} {$vo.note}</p>
                    </foreach>
                </empty>
            </div>
            <div class="col-md-1 last-col"></div>
        </div>

    </div>

</div>

<div class="panel-heading clearfix">
    <div class="pull-right" style="margin-top: 10px;">
        <a href="{:U('read',array('id'=>$order['id']))}" class="btn btn-sm btn-primary">编辑</a>
    </div>
</div>
