<script type="text/javascript">
    function save() {
        sendAjax("{:U('order_status/ready_stock')}", $("#form_data").serialize(), function (data) {
            if (data.status) {
                ui_alert(data.info, function () {
                    parent.location.reload();
                });
            } else {
                ui_error(data.info);
            }
        });
    }
</script>
