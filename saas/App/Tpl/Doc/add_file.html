<layout name='Layout/ace_popup'/>
{:W('PageHeader',array('name'=>'上传图片','search'=>'N'))}


<div class="operate panel">
    <div class="row">
        <div class="pull-left" style="margin-left: 20px;">
            <select name="album_id" id="album_id">
                {:fill_option($albumList,$albumId)}
            </select>
        </div>

        <div class="pull-right">
            <a onclick="saveFile();" class="btn btn-sm btn-default">保存</a>
            <a onclick="myclose();" class="btn btn-sm btn-default">关闭</a>
        </div>
    </div>

    <div id="file_list" class="row" new_upload="">



        <div id="uploader" class="col-xs-12 col-sm-4 mgt10">
            <div style="padding: 0px;">
                <div id="pickFiles" style="width: 42px;line-height: 169px; color: rgb(187, 187, 187); font-size: 72px;margin-left: 60px;">+</div>
            </div>
        </div>

    </div>
</div>
