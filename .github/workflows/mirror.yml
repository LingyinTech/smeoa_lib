name: Auto Sync CNB

on:
  push:
    branches: [main]

jobs:
  sync-cnb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: Mirror to CNB
        run: |
          git lfs fetch origin --all
          git push --mirror https://cnb:${{ secrets.CNB_SYNC_CODE }}@cnb.cool/smartworkflow/smeoa_lib