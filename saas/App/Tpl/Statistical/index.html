<layout name='Layout/ace_layout'/>
<form method="post" name="form_adv_search" id="form_adv_search">
    <div class="adv_search panel panel-default " id="adv_search">
        <div class="panel-heading">
            <div class="row">
                <h4 class="col-xs-6">高级搜索</h4>
                <div class="col-xs-6 text-right">
                    <a class="btn btn-sm btn-info" onclick="submit_adv_search();">搜索</a>
                </div>
            </div>
        </div>
        <div class="panel-body">

            <div class="row">
                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="group_field">分组字段：</label>
                    <div class="col-sm-8">
                        <select name="group_field" id="group_field" class="form-control">
                            {:fill_option($groupFieldList,$groupField)}
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="in_shop_id">店铺名称：</label>
                    <div class="col-sm-8">
                        <select name="in_shop_id[]" id="in_shop_id" class="form-control">
                            <option value="">请选择</option>
                            {:fill_option($shopList,$filter['in_shop_id'], true)}
                        </select>
                    </div>
                </div>

                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="gtt_order_time">下单时间：</label>
                    <div class="col-sm-8">
                        <input data-date-format="yyyy-mm-dd" type="text" id="gtt_order_time" name="gtt_order_time"
                               readonly="readonly" class="input-date form-control" value="{$filter.gtt_order_time}">
                    </div>
                </div>

                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="ltt_create_time">至：</label>
                    <div class="col-sm-8">
                        <input data-date-format="yyyy-mm-dd" type="text" id="ltt_order_time" name="ltt_order_time"
                               readonly="readonly" class="input-date form-control" value="{$filter.ltt_order_time}">
                    </div>
                </div>

            </div>
            <div class="row">

                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="in_order_status">订单状态：</label>
                    <div class="col-sm-8">
                        <select name="in_order_status[]" id="in_order_status" class="form-control">
                            <option value="">请选择</option>
                            {:fill_option($orderStatusList,$filter['in_order_status'], true)}
                        </select>
                    </div>
                </div>

                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="in_order_type">订单类型：</label>
                    <div class="col-sm-8">
                        <select name="in_order_type[]" id="in_order_type" class="form-control">
                            <option value="">请选择</option>
                            {:fill_option($orderTypeList,$filter['in_order_type'], true)}
                        </select>
                    </div>
                </div>

                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="note_status">标记为：</label>
                    <div class="col-sm-8">
                        <select name="note_status" id="note_status" class="form-control">
                            <option value="">请选择</option>
                            {:fill_option($noteStatus,$filter['note_status'])}
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="gtt_order_time">生产时间：</label>
                    <div class="col-sm-8">
                        <input data-date-format="yyyy-mm-dd" type="text" id="gtt_create_time" name="gtt_create_time"
                               readonly="readonly" class="input-date form-control" value="{$filter.gtt_create_time}">
                    </div>
                </div>

                <div class="form-group col-sm-4">
                    <label class="col-sm-4 control-label" for="ltt_create_time">至：</label>
                    <div class="col-sm-8">
                        <input data-date-format="yyyy-mm-dd" type="text" id="ltt_create_time" name="ltt_create_time"
                               readonly="readonly" class="input-date form-control" value="{$filter.ltt_create_time}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<div class="ul_table" style="min-width: 1200px;">
    <ul>
        <li class="thead">
            <div class="pull-left">
                <span class="col-16 text-center border-right"><?=$groupFieldLabel?>&nbsp;</span>
                <span class="col-10 text-center border-right">数量</span>
                <span class="col-10 text-center border-right">订单金额</span>
            </div>
        </li>
        <if condition="!empty($list)">

            <foreach name="list" item="vo">
                <li class="tbody">
                    <div class="pull-left">
                        <span class="col-16 text-center border-right">{$vo.group_field}</span>
                        <span class="col-10 text-center border-right">{$vo.count}</span>
                        <span class="col-10 text-center border-right">{$vo.total_price}</span>
                    </div>
                </li>
            </foreach>

        </if>
    </ul>
</div>
