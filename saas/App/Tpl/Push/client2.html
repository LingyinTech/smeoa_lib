		<script type="text/javascript">
			var flag = true;
			var runing = false;
			var $url="{:U('push/server2')}";
			var url2 = "{:U('push/msgCount')}";

			push_start();
			
			function sendPush($url, vars, callback) {
				return $.ajax({
					type : "POST",
					url : $url,
					data : vars + "&ajax=1",
					dataType : "json",
					success : callback
				});
			}

			function push_start() {
				setInterval(function () {
					sendPush(url2,'',function(data){
						if(data.info > 0){
							parent.document.getElementById('msgCount').style.display='block';
							$('body',parent.document).find('#msgCount').html(data.info);
						}else{
							parent.document.getElementById('msgCount').style.display='none';
						}
					})
				},1000 * 60 * 5);
			}

			function push_stop() {
				flag = false;
			}
			
			// 显示通知
			function show(content) {
			    var notification = window.webkitNotifications.createNotification(
			        'images/icon48.png',
			        '有消息了',
			        content
			    );
			
			    //15秒自动关闭
			    notification.ondisplay = function () {
			        var temp = this;
			        var fn = function () {
			            temp.cancel();
			        };
			        window.setTimeout(fn, 15000);
			    };
			    notification.show();
			}
			
			function showNotification(content){
				//oNotifications = window.Notification;	
				if (!window.Notification){
					window.parent.ui_info(content);
					return;
				}
				if (window.Notification.permission == "granted") {
					show(content);
				}else{
					window.Notification.requestPermission();
				}
			}
		</script>
	</head>
	<body>
	</body>
</html>
