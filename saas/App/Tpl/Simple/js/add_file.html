<script type="text/javascript">
    function checkShow(sid, type) {
        if (['jpg', 'jpeg', 'png'].indexOf(type.toLowerCase()) < 0) {
            return false;
        }

        if ($('img.' + sid).attr('src') == undefined) {
            $('img.' + sid).attr('src', $('img.' + sid).attr('data-src'));
        }
        $('img.' + sid).toggle()
    }

    function save(id) {
        var fileSid = $("ul#file_list").attr("new_upload");
        var prevFiles = $("ul#prev_list").attr("new_upload");
        if (id > 0) {
            //发送请求
            sendAjax("{:U('simple/add_file')}", "order_id=" + id + "&file_sid=" + fileSid + "&prev_files=" + prevFiles, function (data) {
                if (data.status == "success") {
                    myclose();
                } else {
                    ui_error(data.info);
                }
            });
        } else {
            ui_error("非法操作!");
            return false;
        }
    }

</script>
