<script type="text/javascript">	
	function half(id){
		ui_alert('确认已收半款？', function() {
			sendAjax("{:U('half_agree')}", 'orderid='+id, function(data) {
				if (data.status) {
					ui_alert(data.info, function() {
						//parent.location.reload();
						$('#tbody_'+id).remove();
					});
				} else {
					ui_error(data.info);
				}
			});
		});
	}

</script>
