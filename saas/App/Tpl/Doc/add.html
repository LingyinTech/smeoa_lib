<layout name='Layout/ace_popup' />

<div class="operate panel panel-default">
	<div class="panel-body">
		<div class="pull-left">
			<a onclick="save();" class="btn btn-sm btn-primary">确定</a>
		</div>
		<div class="pull-right">
			<a  onclick="myclose();" class="btn btn-sm btn-primary">关闭</a>
		</div>
	</div>
	<form method='post' id="form_data" name="form_data" enctype="multipart/form-data"  class="well form-horizontal">


		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">相册名称*：</label>
			<div class="col-sm-4">
				<input name="name" id="name" value="{$album.name}" check="require" msg="请填相册名称" class="form-control" />
			</div>
		</div>

		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="sort">排序*：</label>
			<div class="col-sm-8">			
				<input name="sort" id="sort" value="{$album.sort}" check="require" msg="请填写排序" class="form-control" />
			</div>
		</div>

		<input name="op_mode" type="hidden" value="{$opMode}" />
		<input name="album_id" id="album_id" value="{$album_id}" type="hidden" />
		<input name="type" id="type" value="{$type}" type="hidden" />
	</form>
</div>
