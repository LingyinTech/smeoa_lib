<layout name='Layout/ace_layout' />
{:W('PageHeader',array('name'=>'权限分配','search'=>'S'))}
<div class="operate panel panel-default">
	<div class="panel-body">
		<div class="pull-right">
			<a onclick="save()" class="btn btn-sm btn-primary">保存</a>
		</div>
	</div>
</div>
<!-- 列表显示区域  -->
<div class="row">
	<form id="form_data" name="form_data" method="post" >
		<div class="col-sm-7 sub_left_menu">
			<table class="table table-bordered">
				<thead>
					<tr>
						<th class="text-center col-3"><label class="inline pull-left">
							<input class="ace" type="checkbox" name="id-toggle-all" id="id-toggle-all" />
							<span class="lbl"></span></label></th>
						<th>
						<nobr>
							员工编号
						</nobr></th>
						<th>
						<nobr>
							姓名
						</nobr></th>
						<th>
						<nobr>
							部门
						</nobr></th>
						<th>
						<nobr>
							状态
						</nobr></th>
					</tr>
				</thead>
				<tbody>
					<volist name="user_list" id="data">
						<tr id="{$data.id}">
							<td class="text-center col-3"><label class="inline pull-left">
								<input class="ace" type="checkbox" name="emp_id[]" value="{$data.id}" />
								<span class="lbl"></span></label></td>
							<td>
							<nobr>
								{$data.emp_no}
							</nobr></td>
							<td>
							<nobr>
								{$data.name}
							</nobr></td>
							<td>
							<nobr>
								{$data.dept_name}
							</nobr></td>

							<td>
							<nobr>
								{$data.is_del|status}
							</nobr></td>
						</tr>
					</volist>
				</tbody>
			</table>			
		</div>
		<div class="col-sm-5 sub_content">
			<input type="hidden" name="id" id="id">
			<input type="hidden" name="pid" id="pid" value="">
			<input type="hidden" name="ajax" id="ajax" value="0">
			<input type="hidden" name="op_mode" id="op_mode" value="">
			<table class="table table-bordered">
				<thead>
					<tr>
						<th>&nbsp;</th>
						<th>名称</th>
					</tr>
				</thead>
				<tbody>
					<volist name="designList" id="data">
						<tr id="picture_{$data.id}">
							<td class="col-3"><label class="inline pull-left ">
								<input class="ace" type="checkbox" id="duty_design_{$data.id}" name="duty_list[]" value="{$data.id}"/>
								<span class="lbl"></span></label></td>
							<td>烫画厂商-{$data.name}</td>
						</tr>
					</volist>
					<volist name="produceList" id="data">
						<tr id="print_{$data.id}">
							<td class="col-3"><label class="inline pull-left ">
								<input class="ace" type="checkbox" id="duty_produce_{$data.id}" name="duty_list[]" value="{$data.id}"/>
								<span class="lbl"></span></label></td>
							<td>丝印厂商-{$data.name}</td>
						</tr>
					</volist>
					<volist name="plateList" id="data">
						<tr id="plate_{$data.id}">
							<td class="col-3"><label class="inline pull-left ">
								<input class="ace" type="checkbox" id="duty_plate_{$data.id}" name="duty_list[]" value="{$data.id}"/>
								<span class="lbl"></span></label></td>
							<td>刺绣厂商-{$data.name}</td>
						</tr>
					</volist>
				</tbody>
			</table>
			<div class="pagination">
				{$page}
			</div>
		</div>
	</form>
</div>
