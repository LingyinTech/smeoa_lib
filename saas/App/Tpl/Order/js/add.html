<script type="text/javascript">

	function add() {
		$("#op_mode").val("add");
		if (check_form("form_data")) {

			const orderType = $("select[name=order_type]").val();
            if (2 == orderType && !$("input[name=content]").val().trim()) {
                ui_error("请填写加定订单备注");
                return false;
            }

            if (4 == orderType && !$("input[name=content]").val().trim()) {
                ui_error("请填写发货时间");
                return false;
            }
            
            let payType = $("select[name=pay_type]").val()
            if ('天猫' == payType && orderType != 5 && !$("input[name=order_sn]").val().trim()) {
                ui_error("请填写订单编号");
                return false;
            }

            if ('天猫' !== payType && orderType != 5 && !$('input[name=payment_voucher]').val().trim()) {
                ui_error("请上传付款凭证");
                return false;
            }

            let orderSn = $("input[name=order_sn]").val().trim();
            if (!!orderSn && 3 != orderType) {
                if (-1 === $('#prev_list span.autocut').text().indexOf(orderSn)) {
                    ui_error("效果图命名与订单号不匹配");
                    return false;
                }

                if (-1 === $('#file_list span.autocut').text().indexOf(orderSn)) {
                    ui_error("打版图命名与订单号不匹配");
                    return false;
                }
            }

            var fileSid = $("ul#file_list").attr("new_upload");
            var prevFiles = $("ul#prev_list").attr("new_upload");
            $("input[name=file_sid]").val(fileSid);
            $("input[name=prev_files]").val(prevFiles);

			sendForm("form_data", "{:U('save')}", "{:U('Order/add')}");
		}
	}

	$(document).ready(function() {
        $(".row.disabled input").attr("disabled", true);
        $(".row.disabled select").attr("disabled", true);

	    $(".shirt_price,.total_price,.diff_price,.rest_price").on("change",function (){
	        let shirtPrice = $("input[name=shirt_price]").val() || 0;
            let totalPrice = $("input[name=total_price]").val() || 0;
            let diffPrice = $("input[name=diff_price]").val() || 0;
            let restPrice = $("input[name=rest_price]").val() || 0;
            let total = parseFloat(totalPrice) - parseFloat(diffPrice) + parseFloat(restPrice);
            let grossProfit = 0;
            if (totalPrice > 0) {
                grossProfit = (1 - shirtPrice / total) * 100;
                grossProfit = grossProfit.toFixed(2);
            }
            $("input[name=gross_profit]").val(grossProfit);
        });

        $('select[name=order_type]').on('change', function () {
            let orderType = Number($(this).val());
            switch (orderType) {
                case 2:
                    $("input[name=content]").attr('placeholder',"备注（加定前订单编号）")
                    break;
                case 4:
                    $("input[name=content]").attr('placeholder',"备注（发货时间）")
                    break;
                default:
                    $("input[name=content]").attr('placeholder',"备注")
            }
        });

        $('select[name=user_id]').on('change', function () {
            $("input[name=sales]").val($("select[name=user_id] option:selected").text());
        });
        
        $('select[name=pay_type]').on('change', function () {
            if('天猫' === $(this).val()) {
                $('.payment_voucher .tips').addClass('display-none');
            } else {
                $('.payment_voucher .tips').removeClass('display-none');
            }
        })

        $('.payment_voucher .fa-search').on('click', function () {
            let sid = $('.payment_voucher input[name=payment_voucher]').val();
            if (!sid) {
                return;
            }
            var url = "{:U('doc/view_picture')}" + '?sid=' + sid;
            layer.open({
                type: 2,
                content: url,
                area: ['960px', '96%'],
                maxmin: true,
                title : '付款凭证',
            });
        });

        $('.payment_voucher .fa-minus').on('click', function () {
            $('.payment_voucher input[name=payment_voucher]').val('');
            $('.payment_voucher .fa-search').addClass('display-none');
        });

        $('.row.style input[type=number]').on('change', function () {

            if ($(this).val().length === 1) {
                $(this).val($(this).val().replace(/[^1-9]/g, ''));
            } else {
                $(this).val($(this).val().replace(/\D/g, ''));
            }

            const row = $(this).closest('.style');
            const index = row.attr('data-product-index');
            let mtotal = 0, ftotal = 0;
            $('.row.style[data-product-index='+index+'] input[type=number]').each(function () {
                const name = $(this).attr('name');
                const count = Number($(this).val())
                if (name.indexOf('m') === 0) {
                    mtotal += count;
                } else {
                    ftotal += count;
                }
            });
            row.find('input[name="mtotal['+index+']"]').val(mtotal);
            row.find('input[name="ftotal['+index+']"]').val(ftotal);
            row.find('input[name="total_count['+index+']"]').val(mtotal + ftotal);
        });

        $('.row.style .fa-plus').on('click', function (){
            const currentLine = $(this).closest('.style');
            let newLine = currentLine.clone(true);
            let nextIndex = 0;
            $('.row.style').each(function () {
                const currentIndex = Number($(this).attr('data-product-index'));
                if (nextIndex <= currentIndex) {
                    nextIndex = currentIndex +1;
                }
            });

            newLine.find('select').each(function (){
                const newName = $(this).attr('name').replace(/(\d+)/g, nextIndex);
                $(this).attr('name', newName);
            });

            newLine.find('input').each(function (){
                const newName = $(this).attr('name').replace(/(\d+)/g, nextIndex);
                $(this).attr('name', newName);
            });

            newLine.find('textarea').each(function (){
                const newName = $(this).attr('name').replace(/(\d+)/g, nextIndex);
                $(this).attr('name', newName);
            });

            newLine.attr('data-product-index', nextIndex);
            currentLine.after(newLine);
        });

        $('.row.style .fa-minus').on('click', function (){
            if ($('.row.style').length <= 1) {
                return;
            }
            $(this).closest('.style').remove();
        });
	});


</script>
