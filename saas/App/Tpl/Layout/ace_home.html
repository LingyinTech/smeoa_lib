<script type="text/javascript">
			var flag = true;
			var runing = false;
			var $url="{:U('push/server2')}";
			push_start();

			function sendPush($url, vars, callback) {
				return $.ajax({
					type : "POST",
					url : $url,
					data : vars + "&ajax=1",
					dataType : "json",
					success : callback
				});
			}

			function push_start() {
				sendPush($url, '', function(data) {
					if (data.info != "no-data") {
						//window.parent.ui_info(data.info);
						showNotification(data.info);
					}
					if (flag) {
						push_start();
					}
				});
			}

			function push_stop() {
				flag = false;
			}
			
			// 显示通知
			function show(content) {
			    var notification = window.webkitNotifications.createNotification(
			        'images/icon48.png',
			        '有消息了',
			        content
			    );
				
				/*
			    notification.onclick = function () {
			        chrome.tabs.create({url:MESSAGE});
			        this.cancel();
			    };*/
			
			    // 15秒自动关闭
			    notification.ondisplay = function () {
			        var temp = this;
			        var fn = function () {
			            temp.cancel();
			        };
			        window.setTimeout(fn, 15000);
			    };
			
			
			    notification.show();
			
			}
			
			function showNotification(content){
				if (window.webkitNotifications){
					alert('不支持');
					window.parent.ui_info(content);
					return;
				}
				if (window.webkitNotifications.checkPermission() > 0) {
					RequestPermission(showNotification);
				}else{
					show(content);
				}
			}
			
			function RequestPermission (callback) {
				window.webkitNotifications.requestPermission(callback);
			}
	
		</script>
