<script type="text/javascript">	
	function save(){
		if (check_form("form_data")){
			sendAjax("{:U('delivery')}", $("#form_data").serialize(), function(data) {
				if (data.status) {
					ui_alert(data.info, function() {
						parent.location.reload();
					});
				} else {
					ui_error(data.info);
				}
			});
		}
	}
</script>
