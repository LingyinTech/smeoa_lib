<script type="text/javascript">

    function pdfPrint() {

        let craftType = $('.craft_type').attr('data-craft');
        if (!craftType && !confirm('订单未选择工艺，确定要打印？')) {
            return;
        }

        var oldHtml = window.document.body.innerHTML;//获取当前页的html代码
        var startStr = "<!--startprint-->";//设置打印开始区域
        var endStr = "<!--endprint-->";//设置打印结束区域
        var printHtml = oldHtml.substring(oldHtml.indexOf(startStr) + 18); //从开始代码向后取html
        var printHtml = printHtml.substring(0, printHtml.indexOf(endStr));//从结束代码向前取html
        window.document.body.innerHTML = printHtml;
        window.print();
        window.document.body.innerHTML = oldHtml;
    }

    function selectPrint(id) {
        var url = "{:U('print/select')}" + '?id=' + id;
        winopen(url, 700, 300);
    }

    $(document).ready(function () {

    });

</script>
