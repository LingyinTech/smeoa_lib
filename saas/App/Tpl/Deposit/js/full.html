<script type="text/javascript">	
	function full(id){
		ui_alert('确认已收全款？', function() {
			sendAjax("{:U('full_agree')}", 'orderid='+id, function(data) {
				if (data.status) {
					ui_alert(data.info, function() {
						//parent.location.reload();
						$('#tbody_'+id).remove();
					});
				} else {
					ui_error(data.info);
				}
			});
		});
	}
	
	/*
	function full(id){
		url = "{:U('full_agree')}" + '?orderid=' + id;
		winopen(url, 700, 600);
	}*/
</script>
