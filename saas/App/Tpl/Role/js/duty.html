<script type="text/javascript">
    function btn_search() {
        sendForm("form_search", "__SELF__");
        $("#form_search").submit();
    }

    function key_search() {
        if (event.keyCode == 13) {
            sendForm("form_search", "__SELF__");
            return false;
        }
    }

    function save() {
        if ($("input:checked[name='emp_id[]']").length < 1) {
            ui_error("请选择用户");
            return false;
        }
        ;
        if ($("input:checked[name='duty_list[]']").length < 1) {
            ui_error("请选择权限");
            return false;
        }
        ;
        sendForm("form_data", "{:U('set_duty')}");
    }

    function showdata(result) {
        $("input[name='duty_list[]']").each(function () {
            $(this).prop('checked', false);
        });
        for (var s in result.data) {
            if ($("#duty_design_" + result.data[s].partner_id).val() !== undefined) {
                $("#duty_design_" + result.data[s].partner_id).prop('checked', true);
            }

            if ($("#duty_produce_" + result.data[s].partner_id).val() !== undefined) {
                $("#duty_produce_" + result.data[s].partner_id).prop('checked', true);
            }

            if ($("#duty_plate_" + result.data[s].partner_id).val() !== undefined) {
                $("#duty_plate_" + result.data[s].partner_id).prop('checked', true);
            }
        }
    }


    $(document).ready(function () {
        set_return_url();
        $(".sub_left_menu tbody tr").click(function () {
            $(".sub_left_menu  tr").attr("class", "");
            $(this).attr("class", "active");
            sendAjax("{:U('get_duty_list')}", "id=" + $(this).attr("id"), function (data) {
                showdata(data);
            });
        });
    });
</script>
