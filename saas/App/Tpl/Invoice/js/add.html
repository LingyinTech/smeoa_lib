<script type="text/javascript">
	function add() {
		$("#op_mode").val("add");
		if (check_form("form_data")) {
			if ($('#ship_time').val() < 1) {
				ui_error($('#ship_time').attr("msg"));
				return false;
			}
			sendForm("form_data", "{:U('save')}", "{:U('invoice/add')}");
		}
	}


	$(document).ready(function() {
        $("#ship_city").citypicker();

        $('select[name=user_id]').on('change', function () {
            $("input[name=sales]").val($("select[name=user_id] option:selected").text());
        })
	}); 
</script>
