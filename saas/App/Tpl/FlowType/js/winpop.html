<script type="text/javascript">
	function save() {
		var aname=new Array();
		var aid=new Array();
		$("#rc select option").each(function(i) {
			id = $(this).val();
			aid.push(id);
			name = jQuery.trim($(this).text());
			aname.push(name);
			//html_string = conv_inputbox_item(emp_no, name, name, emp_no);
			//$("#confirm_wrap .address_list", parent.document).append(html_string);
		});
		$("#produce_name", parent.document).val(aname.join(','));
		$("#produce_no", parent.document).val(aid.join(','));
		myclose();
	}


	$(document).ready(function() {
		$("#flow_type .tree_menu a").click(function() {
			$("#flow_type .tree_menu a").each(function() {
				$(this).attr("class", "");
			});
			$(this).addClass("active");

			var type = $("input[name='type']:checked").val();

			return false;
			//禁止连接生效
		});
		
	}); 
	
	function add_address(name) {
		
		$flow_id = $("#flow_type a.active").attr("node");
		$flow_name = $("#flow_type a.active span").text();
		if ($flow_id == undefined) {
			ui_error("请选择流程");
			return false;
		}
		$text = $flow_name;
		$val = $flow_id;
		$("<option></option>").val($val).text($text).appendTo("#" + name + " select");
		$("#" + name + "_count").text("(" + $("#" + name + " select option").length + ")");
	}
</script>
