<layout name='Layout/ace_popup' />

<div class="operate panel panel-default">
	<div class="panel-body">
		<div class="pull-left">
			<a onclick="save();" class="btn btn-sm btn-primary">确定</a>
		</div>
		<div class="pull-right">
			<a  onclick="myclose();" class="btn btn-sm btn-primary">关闭</a>
		</div>
	</div>
	<form method='post' id="form_data" name="form_data" enctype="multipart/form-data"  class="well form-horizontal">
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="ship_name">快递名称*：</label>
			<div class="col-sm-4">
				<select name="ship_name" id="ship_name" check="require" msg="快递名称不能为空">
					<option value="">请选择</option>
					{:fill_option($shipTypeList,$shipInfo['ship_name'])}
				</select>
			</div>
		</div>

		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="ship_price">价格*：</label>
			<div class="col-sm-4">
				<input name="ship_price" id="ship_price" value="{$shipInfo.ship_price}" check="require" msg="请填写快递价格" class="form-control" />
			</div>
		</div>

		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="ship_code">快递单号*：</label>
			<div class="col-sm-8">			
				<input name="ship_code" id="ship_code" value="{$shipInfo.ship_code}" check="require" msg="快递单号不能为空" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="note">说明*：</label>
			<div class="col-sm-8">			
				<input name="note" id="note" value="{$shipInfo.note}" class="form-control" />
			</div>
		</div>
		<input name="op_mode" type="hidden" value="{$opMode}" />
		<input name="order_id" id="order_id" value="{$order_id}" type="hidden" />
		<input type="hidden" id="ajax" name="ajax" value="1">
	</form>
</div>
