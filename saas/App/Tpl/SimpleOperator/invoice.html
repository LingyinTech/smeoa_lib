<layout name='Layout/ace_popup' />

<div class="operate panel panel-default">
	<div class="panel-body">
		<div class="pull-left">
			<a  onclick="myclose();" class="btn btn-sm btn-primary">关闭</a>
		</div>
		<div class="pull-right">
			<a  onclick="save();" class="btn btn-sm btn-primary">确定</a>			
		</div>
	</div>
	<form method='post' id="form_data" name="form_data" enctype="multipart/form-data"  class="well form-horizontal">
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="note">留言*：</label>
			<div class="col-sm-8">
				<input name="note" id="note" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="dept_id">部门*：</label>
			<div class="col-sm-8">
				<select name="dept_id" id="dept_id">
					<option value="">请选择</option>
					{:fill_option($deptList)}
				</select>

				<select name="receiver_id" id="receiver_id">
					<option value="">请选择</option>
				</select>
			</div>
		</div>
		<input name="operator" id="operator" value="{$operator}" type="hidden">
		<input name="order_id" id="order_id" value="{$orderId}" type="hidden" />
		<input type="hidden" id="ajax" name="ajax" value="1">
	</form>
</div>
