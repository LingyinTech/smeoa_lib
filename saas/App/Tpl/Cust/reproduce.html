<layout name='Layout/ace_popup' />

<div class="operate panel panel-default">
	<div class="panel-body">
		<div class="pull-left">
			<a  onclick="myclose();" class="btn btn-sm btn-primary">关闭</a>
		</div>
		<div class="pull-right">			
			<a  onclick="save();" class="btn btn-sm btn-primary">确定</a>
		</div>
	</div>
	<form method='post' id="form_data" name="form_data" enctype="multipart/form-data"  class="well form-horizontal">
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">说明*：</label>
			<div class="col-sm-8">
				<input name="reason" id="reason" class="form-control" />
			</div>
		</div>
		<div class="form-group col-sm-6">
			<label class="col-sm-4 control-label" for="name">发货日期*：</label>
			<div class="col-sm-8">
				<input data-date-format="yyyy-mm-dd" type="text" id="ship_time" name="ship_time" value="{$order.ship_time|date="Y-m-d",###}" readonly="readonly" class="input-date form-control" checked="require" msg="发货时间不能为空" >
			</div>
		</div>
		<input name="orderid" id="orderid" value="{$orderid}" type="hidden" />
		<input type="hidden" id="ajax" name="ajax" value="1">
		<input type="hidden" name="op_mode" id="op_mode" value="add">
	</form>
</div>
