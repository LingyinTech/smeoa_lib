<script type="text/javascript">
    function add() {
        $("#op_mode").val("add");
        $("#id").val("");
        var node = $('#node_list').val();
        if (check_form("form_data")) {
            sendForm("form_data", "{:U('save')}", "{:U('partner/index')}" + '?node=' + node);
        }
    }

    function del() {
        var vars = $("#form_data").serialize();
        ui_confirm('确定要删除吗?', function () {
            sendAjax("{:U('del')}", vars, function (data) {
                if (data.status) {
                    ui_alert(data.info, function () {
                        location.reload();
                    });
                }
            });
        })
    }

    function save() {
        if (check_form("form_data")) {
            sendForm("form_data", "{:U('save')}");
        }
    }

    function showData(result) {
        for (var s in result.data) {
            set_val(s, result.data[s]);
        }
        $("#op_mode").val("edit");
    }

    $(document).ready(function () {
        set_return_url();
        set_val('type', '{$type}');
        $(".sub_left_menu .tree_menu a").click(function () {
            $(".sub_left_menu .tree_menu  a").each(function () {
                $(this).attr("class", "");
            });
            $(this).attr("class", "active");
            sendAjax("{:U('read')}", "id=" + $(this).attr("node"), function (data) {
                showData(data);
            });
            return false;
        });
        sendAjax("{:U('read')}", "type={$type}", function (data) {
            showData(data);
        });
    });
</script>
