<layout name='Layout/ace_layout' />
{:W('PageHeader',array('name'=>'部门订单','search'=>'S'))}
<div class="ul_table message-container" style="min-width: 1080px;">
	<ul>
		<li class="thead">
			<div class="pull-left">
				<span class="col-14 text-center border-right">订单编号</span>
				<span class="col-14 text-center border-right">接单人</span>
				<span class="col-14 text-center border-right">客户名称（班长）</span>				
				<span class="col-14 text-center border-right">单    位（班级）</span>
				<span class="col-14 text-center border-right">选定款式</span>
				<span class="col-10 text-center border-right">客户电话</span>
				<span class="col-10 text-center border-right">客户QQ</span>
				<span class="col-9 text-center border-right">下单时间</span>
				<span class="col-6 text-center">订单状态</span>
			</div>
		</li>
		<empty name="list">
			<li class="no-data">
				暂无订单
			</li>
			<else/>
			<form method="post" action="" name="form_data" id="form_data">
				<foreach name="list" item="vo">
					<li class="tbody">
						<div class="pull-left">
							<span class="col-14 text-center border-right">订单编号</span>
							<span class="col-14 text-center border-right">接单人</span>
							<span class="col-14 text-center border-right">客户名称（班长）</span>				
							<span class="col-14 text-center border-right">单    位（班级）</span>
							<span class="col-14 text-center border-right">选定款式</span>
							<span class="col-10 text-center border-right">客户电话</span>
							<span class="col-10 text-center border-right">客户QQ</span>
							<span class="col-9 text-center border-right">下单时间</span>
							<span class="col-6 text-center">订单状态</span>
						</div>
					</li>
				</foreach>
			</form>
			<div class="pagination">
				{$page}
			</div>
		</empty>
	</ul>
</div>
