<script type="text/javascript">
    function saveFile() {
        var album_id = $('#album_id').val();
        var sidStr = $('#file_list').attr('new_upload');
        if (album_id == false) {
            ui_error('请选择相册');
            return;
        }

        if (sidStr == false) {
            ui_error('请先上传图片');
            return;
        }

        sendAjax("{:U('add_file')}", 'album_id=' + album_id + "&sid=" + sidStr, function (data) {
            if (data.status) {
                myclose();
            } else {
                ui_error(data.info);
            }
        });
    }
</script>
